# bindings.example.yaml — copy to bindings.yaml and replace the example IDs.
#
# One binding/route maps one exact IM endpoint to one concrete tmux pane.
# One bot/app credential may serve routes using different CLI adapters.
#
# Fields:
#   name          unique route name
#   channel       telegram / feishu
#   chat_id       Telegram int; Feishu string oc_xxx
#   thread_id     Telegram forum topic int; Feishu thread omt_xxx; root/DM null
#   tmux_session  tmux session name
#   tmux_window   tmux window index
#   tmux_pane     tmux pane index
#   cwd           CLI working directory
#   backend       claude_code / codex / omp
#   bot_token_env credential namespace; routes sharing it use one bot/app
#   mention_required explicit group/topic mention policy; project topics usually false
#
# Validate after editing:
#   tmuxbot route --file /path/to/bindings.yaml validate
# Prefer `tmuxbot admin provision-project` for normal project creation/binding;
# it plans first, then owns target creation, atomic write, restart and verification.

bindings:
  # Telegram DM -> Claude Code
  - name: my-project
    channel: telegram
    bot_token_env: TG_BOT_TOKEN
    chat_id: 123456789
    thread_id: null
    tmux_session: my-project
    tmux_window: 0
    tmux_pane: 0
    cwd: /home/youruser/projects/my-project
    backend: claude_code

  # Two topics in one Telegram project group can use different adapters.
  - name: project-review
    channel: telegram
    bot_token_env: TG_BOT_TOKEN
    chat_id: -1001234567890
    thread_id: 1070
    tmux_session: project-workspace
    tmux_window: 0
    tmux_pane: 0
    cwd: /home/youruser/projects/project-review
    backend: omp
    mention_required: false

  - name: project-implementation
    channel: telegram
    bot_token_env: TG_BOT_TOKEN
    chat_id: -1001234567890
    thread_id: 1071
    tmux_session: project-workspace
    tmux_window: 0
    tmux_pane: 1
    cwd: /home/youruser/projects/project-implementation
    backend: codex

  # Feishu thread -> OMP. Root messages are a different endpoint and stay silent.
  # If OMP later opens a menu/input/confirmation, tmuxbot only sends an SSH notice
  # for this exact pane; it never drives OMP keys from Telegram/Feishu.
  - name: feishu-topic
    channel: feishu
    bot_token_env: FEISHU
    chat_id: oc_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    thread_id: omt_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    # Durable root anchor returned by `tmuxbot admin feishu-topics`.
    # Required so direct tmux TUI replies still return to this thread after bridge restart.
    thread_root_message_id: om_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    tmux_session: feishu-topic
    tmux_window: 0
    tmux_pane: 0
    cwd: /home/youruser/projects/feishu-topic
    backend: omp
